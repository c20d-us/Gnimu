name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: tests/run.sh

  compile:
    name: compile ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, nrf52840]
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board cores
        run: |
          arduino-cli core update-index --config-file arduino-cli.yaml
          arduino-cli core install esp32:esp32@3.3.11 --config-file arduino-cli.yaml
          arduino-cli core install Seeeduino:nrf52@1.1.13 --config-file arduino-cli.yaml
      - run: scripts/build.sh ${{ matrix.board }}
